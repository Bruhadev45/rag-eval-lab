name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    name: tests + byte-identical reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Reproduce results from data
        run: make reproduce

      - name: Verify nothing drifted
        run: |
          # Figures are PNGs; matplotlib output can differ per platform by
          # metadata, so the drift gate covers the numeric outputs.
          git diff --exit-code results/results.json results/TABLES.md
