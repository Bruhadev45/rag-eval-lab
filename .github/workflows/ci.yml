name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: py${{ matrix.python }} — lint, tests + coverage, byte-identical reproduction
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # pyproject's addopts carry --cov=rageval --cov-fail-under=85.
      - name: Test + coverage floor
        run: pytest -q

      - name: Reproduce results from data
        run: make reproduce

      - name: Verify nothing drifted
        run: |
          # Figures are PNGs; matplotlib output can differ per platform by
          # metadata, so the drift gate covers the numeric outputs.
          git diff --exit-code results/results.json results/TABLES.md
