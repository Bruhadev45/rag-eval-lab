[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rageval-lab"
version = "1.0.0"
description = "Reproducible retrieval benchmark: hybrid RRF fusion helps legal RAG, a generic cross-encoder reranker hurts it."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kandimalla Bruhadev", email = "devbruha@gmail.com" }]
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
# The legal-demo live harness (rageval.legal_demo.live) fuses with the owner's
# ragfuse, pinned to a commit that has fuse(). Never the unrelated PyPI package
# named ragfuse. MIT licensed, no runtime dependencies of its own.
live = ["ragfuse @ git+https://github.com/Bruhadev45/ragfuse@b447cc365f5a4d9f5cbcbb647592ca95582a0bff"]
dev = ["pytest>=8.0", "pytest-cov>=7.0", "ruff>=0.6", "ragfuse @ git+https://github.com/Bruhadev45/ragfuse@b447cc365f5a4d9f5cbcbb647592ca95582a0bff"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rageval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor, enforced on every `pytest` run (CI and local alike).
addopts = "--cov=rageval --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# tests/test_cli.py runs the report as a real subprocess; measure it too.
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py310"
